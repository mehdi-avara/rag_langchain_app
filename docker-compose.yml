version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    image: rag_langchain_app-backend
    # build:
      # context: ./backend
      # target: backend
    env_file: .env
    environment:
      files_dir: /app/uploaded_files
      redis_url: redis://redis:6379/0
      request_log_file: /app/logs/api.log
      STT_URL: http://stt:8010
      postgres_url: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TIKTOKEN_CACHE_DIR: /app/.tiktoken-cache
    depends_on:
      - postgres
      # - elastic
      # - chroma
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - $files_dir:/app/uploaded_files
      - $request_log_path:/app/logs/
      # - chroma_data:/data/chroma

  celery:
    image: rag_langchain_app-celery
    # build:
    #   context: ./backend
    #   target: celery
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    env_file: .env
    environment:
      files_dir: /app/uploaded_files
      redis_url: redis://redis:6379/0
      mineru_running_address: mineru
      NVIDIA_VISIBLE_DEVICES: all
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 67e8fce7b09fb9251889df2061
      POSTGRES_IP: postgres
      postgres_url: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
      - $files_dir:/app/uploaded_files

  stt:
    image: rag_langchain_app-stt
    # build:
    #   context: ./services/stt
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    env_file: .env
    environment:
      WHISPER_MODEL: medium
      WHISPER_LANGUAGE: fa
      WHISPER_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - whisper_cache:/root/.cache/whisper
    ports:
      - "127.0.0.1:8010:8010"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: porsa_minio
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data


  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_pgvector
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Optional: change where PG stores data inside the container
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # If you want it only locally accessible, keep 127.0.0.1
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data



volumes:
  minio_data:
  # pg_data:
  redis_data:
  whisper_cache:
  pgvector_data:
  # chroma_data: 
