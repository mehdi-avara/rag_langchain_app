version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    # image: rag_langchain_app-backend
    build:
      context: ./backend
      target: backend
    env_file: .env
    environment:
      files_dir: /app/uploaded_files
      redis_url: redis://redis:6379/0
      request_log_file: /app/logs/api.log
    # depends_on:
      # - postgres
      # - elastic
      # - chroma
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - $files_dir:/app/uploaded_files
      - $request_log_path:/app/logs/
      # - chroma_data:/data/chroma

  celery:
    build:
      context: ./backend
      target: celery
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    env_file: .env
    environment:
      files_dir: /app/uploaded_files
      redis_url: redis://redis:6379/0
      mineru_running_address: mineru
      NVIDIA_VISIBLE_DEVICES: all
    depends_on:
      - redis
    volumes:
      - $files_dir:/app/uploaded_files
volumes:
  # pg_data:
  redis_data:
  # chroma_data: 
