version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    image: rag_langchain_app-backend
    build: ./backend
    env_file: .env
    environment:
      files_dir: /app/uploaded_files
      redis_url: redis://redis:6379/0
    # depends_on:
      # - postgres
      # - elastic
      # - chroma
    ports:
      - "8001:8000"
    volumes:
      - ./backend/uploaded_files:/app/uploaded_files
      # - chroma_data:/data/chroma

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    env_file: .env
    environment:
      files_dir: /app/uploaded_files
      redis_url: redis://redis:6379/0
      mineru_running_address: mineru
      NVIDIA_VISIBLE_DEVICES: all
    depends_on:
      - redis
    volumes:
      - ./backend/uploaded_files:/app/uploaded_files
volumes:
  # pg_data:
  redis_data:
  # chroma_data: 